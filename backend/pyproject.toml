[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mfit-hevy"
version = "0.1.0"
description = "Sistema seguro para importar fichas de treino do MFIT para o Hevy"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Equipe MFIT → Hevy"}
]
license = {text = "MIT"}

dependencies = [
    # FastAPI and async
    "fastapi==0.141.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.20",
    
    # Data validation
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    
    # Database
    "sqlalchemy==2.0.46",
    "alembic==1.12.1",
    "psycopg[binary]==3.3.5",  # PostgreSQL adapter (optional)
    
    # PDF extraction
    "pymupdf==1.23.8",
    "pdfplumber==0.10.3",
    
    # Text matching
    "rapidfuzz==3.6.1",
    
    # HTTP client
    "httpx==0.25.2",
    
    # Utilities
    "python-dotenv==1.0.0",
    "loguru==0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "isort==5.13.2",
    "flake8==6.1.0",
    "mypy==1.7.1",
    "httpx[testing]==0.25.2",
]

[project.urls]
Repository = "https://github.com/user/mfit-hevy"
Documentation = "https://github.com/user/mfit-hevy/docs"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
py_version = 312

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "--cov=backend/src --cov-report=html --cov-report=term-missing"
